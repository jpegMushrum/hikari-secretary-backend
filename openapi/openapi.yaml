openapi: 3.1.0
info:
  title: Hikari Secretary Backend API
  version: 0.3.0-dev
  description: |
    Внутренний API платформы Hikari Secretary. Административные предметные
    endpoints требуют проверенные Telegram Mini App credentials и роль
    администратора. Внутренние Bot API endpoints требуют отдельный service token.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Проверка работоспособности процесса
      responses:
        '200':
          description: Процесс запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      summary: Проверка готовности сервиса и PostgreSQL
      responses:
        '200':
          description: PostgreSQL доступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: PostgreSQL временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/admin/me:
    get:
      summary: Текущий аутентифицированный администратор
      security:
        - telegramInitData: []
      responses:
        '200':
          description: Подписанный пользователь Telegram присутствует в списке администраторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Administrator'
        '401':
          description: Telegram initData отсутствует, изменён или устарел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь Telegram не является администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/people:
    get:
      summary: Постраничный список людей для администрации
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Поиск по ФИО, Telegram username или отображаемому имени.
          schema:
            type: string
            maxLength: 100
        - name: is_russian_citizen
          in: query
          schema:
            type: boolean
        - name: is_itmo_student
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, visits, last_visit]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Список людей и применённые параметры таблицы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeoplePage'
        '400':
          description: Один из query-параметров не соответствует контракту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Telegram initData отсутствует, изменён или устарел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь Telegram не является администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/bot/v1/people/identity:
    post:
      summary: Синхронизировать Telegram-идентичность человека из бота
      description: Этот маршрут не публикуется наружу reverse proxy.
      security:
        - botServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncTelegramIdentityRequest'
      responses:
        '200':
          description: Идентичность создана или обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramIdentity'
        '400':
          description: Неподходящее тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверный service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/events:
    get:
      summary: Постраничный список мероприятий
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, cancelled, completed]
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: starts_from
          in: query
          schema:
            type: string
            format: date-time
        - name: starts_to
          in: query
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          schema:
            type: string
            enum: [starts_at, title, created_at]
            default: starts_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Список мероприятий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '400':
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Невалидный Telegram initData
        '403':
          description: Нет роли администратора
  /api/v1/admin/events/{event_id}:
    get:
      summary: Карточка мероприятия
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Мероприятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Мероприятие не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/events/{event_id}/participants:
    get:
      summary: Участники мероприятия
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/EventID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [registered, cancelled]
        - name: is_russian_citizen
          in: query
          schema:
            type: boolean
        - name: is_itmo_student
          in: query
          schema:
            type: boolean
        - name: needs_pass
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, registered_at, needs_pass]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Список участников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsPage'
        '400':
          description: Некорректные параметры
        '404':
          description: Мероприятие не найдено
  /api/v1/admin/events/{event_id}/cancel:
    post:
      summary: Отменить активное мероприятие
      description: Уведомления зарегистрированным участникам атомарно ставятся в outbox.
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Мероприятие отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEventResult'
        '404':
          description: Мероприятие не найдено
        '409':
          description: Мероприятие уже отменено или завершено
components:
  securitySchemes:
    telegramInitData:
      type: http
      scheme: tma
      description: Исходная строка Telegram.WebApp.initData в заголовке Authorization.
    botServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
      description: Отдельный BOT_SERVICE_TOKEN для bot-to-backend запросов.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        enum: [10, 20, 30]
        default: 10
    EventID:
      name: event_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    Administrator:
      type: object
      required: [telegram_id, first_name, last_name, username]
      properties:
        telegram_id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          examples: [unauthorized]
    PersonListItem:
      type: object
      required: [id, telegram_user_id, display_name, visits, feedback_count]
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: [string, 'null']
        telegram_user_id:
          type: integer
          format: int64
        username:
          type: [string, 'null']
        display_name:
          type: string
        is_russian_citizen:
          type: [boolean, 'null']
        is_itmo_student:
          type: [boolean, 'null']
        visits:
          type: integer
          format: int64
        feedback_count:
          type: integer
          format: int64
        last_visit_at:
          type: [string, 'null']
          format: date-time
    PeoplePage:
      type: object
      required: [items, page, sort, filters]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonListItem'
        page:
          $ref: '#/components/schemas/PageMetadata'
        sort:
          type: object
          required: [field, order]
          properties:
            field:
              type: string
              enum: [name, visits, last_visit]
            order:
              type: string
              enum: [asc, desc]
        filters:
          type: object
    PageMetadata:
      type: object
      required: [number, size, total_items, total_pages]
      properties:
        number:
          type: integer
        size:
          type: integer
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    SyncTelegramIdentityRequest:
      type: object
      required: [telegram_user_id, display_name]
      properties:
        telegram_user_id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
          maxLength: 33
        display_name:
          type: string
          minLength: 1
          maxLength: 256
    TelegramIdentity:
      type: object
      required: [person_id, telegram_user_id, username, display_name]
      properties:
        person_id:
          type: integer
          format: int64
        telegram_user_id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type: string
    Event:
      type: object
      required: [id, title, starts_at, ends_at, status, published, registrations, cancelled_registrations, attended, created_at]
      properties:
        id:
          type: integer
          format: int64
        publication_id:
          type: [integer, 'null']
          format: int64
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, cancelled, completed]
        published:
          type: boolean
        registrations:
          type: integer
          format: int64
        cancelled_registrations:
          type: integer
          format: int64
        attended:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    Participant:
      type: object
      required: [person_id, telegram_user_id, full_name, registered_at, status, needs_pass]
      properties:
        person_id:
          type: integer
          format: int64
        telegram_user_id:
          type: integer
          format: int64
        full_name:
          type: string
        username:
          type: [string, 'null']
        registered_at:
          type: string
          format: date-time
        cancelled_at:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [registered, cancelled]
        attended:
          type: [boolean, 'null']
        is_russian_citizen:
          type: [boolean, 'null']
        is_itmo_student:
          type: [boolean, 'null']
        needs_pass:
          type: boolean
    EventsPage:
      type: object
      required: [items, page, sort, filters]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          $ref: '#/components/schemas/PageMetadata'
        sort:
          type: object
        filters:
          type: object
    ParticipantsPage:
      type: object
      required: [items, page, sort, filters]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        page:
          $ref: '#/components/schemas/PageMetadata'
        sort:
          type: object
        filters:
          type: object
    CancelEventResult:
      type: object
      required: [event, notifications_queued]
      properties:
        event:
          $ref: '#/components/schemas/Event'
        notifications_queued:
          type: integer
          format: int64
