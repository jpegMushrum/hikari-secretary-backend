        '403': {description: Не администратор}
        '409': {description: Нет сегодняшнего задания или публикации, доступных для отмены}
        '500': {description: Ошибка хранения}
  /api/v1/admin/ai/automation/cancel-queued:
    post:
      summary: Отменить выход последнего ИИ-поста в очереди
      description: >
        Отменяет запланированный ИИ-пост с наибольшим ID независимо от даты
        и способа запуска, пока все доставки ожидают отправки или повторной
        попытки. Отменяется и текущая подготовка замены материала этого поста.
        Настройка ежедневной генерации сохраняется.
      security: [{telegramInitData: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publication_id]
              properties:
                publication_id: {type: integer, format: int64, minimum: 1, description: ID из queued_publication_id}
      responses:
        '200':
          description: Состояние ежедневной генерации после отмены
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIAutomation'}
        '400': {description: Некорректное тело или ID публикации}
        '401': {description: Невалидный или отсутствующий initData}
        '403': {description: Не администратор}
        '409': {description: ID не соответствует последнему ИИ-посту в очереди или отмена недоступна}
        '500': {description: Ошибка хранения}
  /api/v1/admin/ai/generations/queue:
    post:
      summary: Поставить новую генерацию ИИ в очередь
      description: >
        Запрос без тела. При выполнении задания используются сохранённые
        уровень JLPT и комментарий.
        У ближайшего ожидающего ИИ-поста сохраняются время отправки и цели.
        При пустой очереди новое задание использует ближайшее время
        AI_TOPIC_AUTO_PUBLISH_TIME в часовом поясе TIMEZONE или ставится
        на отправку сразу после успешной генерации, если время не задано.
        Ручная постановка доступна при выключенной автогенерации и сохраняет
        её настройку.
      security: [{telegramInitData: []}]
      responses:
        '202':
          description: Задание принято в очередь
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: {type: integer, format: int64, minimum: 1}
        '401': {description: Невалидный или отсутствующий initData}
        '403': {description: Не администратор}
        '409': {description: 'Выбранная публикация недоступна для замены, код invalid_state'}
        '503': {description: 'Генератор не подключён, код ai_disabled'}
        '500': {description: Ошибка хранения}
  /api/v1/admin/ai/history:
    get:
      summary: История заданий подготовки материалов ИИ
      security: [{telegramInitData: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: status
          in: query
          schema: {type: string, enum: [pending, retry, generating, scheduled, failed, cancelled]}
        - name: sort
          in: query
          description: При сортировке по publication_status задания без связанного статуса идут последними в обоих направлениях.
          schema: {type: string, enum: [id, title, scheduled_for, status, publication_status, attempts], default: scheduled_for}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        '200':
          description: Задания, включая незавершённые, со стабильной сортировкой
          content:
            application/json:
              schema:
                type: object
                required: [items, page, sort, filters]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AIJob'}
                  page: {$ref: '#/components/schemas/PageMetadata'}
                  sort:
                    type: object
                    properties:
                      field: {type: string, enum: [id, title, scheduled_for, status, publication_status, attempts]}
                      order: {type: string, enum: [asc, desc]}
                  filters:
                    type: object
                    properties:
                      status: {type: string}
        '400': {description: Некорректные параметры или повторные значения}
        '401': {description: Невалидный или отсутствующий initData}
        '403': {description: Не администратор}
        '500': {description: Ошибка хранения}
  /api/v1/admin/ai/history/latest:
    get:
      summary: Последняя генерация материала ИИ
      description: >
        Выбирается задание с наибольшим scheduled_for, затем с наибольшим ID.
        Начальные задания в очереди без попыток, ручного запроса, материала и
        публикации пропускаются. Фильтры, сортировка и страницы истории на выбор
        не влияют.
      security: [{telegramInitData: []}]
      responses:
        '200':
          description: Последнее задание с признаком доступности замены
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIJob'}
        '204': {description: Нет заданий, подходящих под критерии выбора}
        '401': {description: Невалидный или отсутствующий initData}
        '403': {description: Не администратор}
        '500': {description: Ошибка хранения}
  /api/v1/admin/ai/history/latest/regenerate:
    post:
      summary: Поставить последнюю генерацию ИИ в очередь на замену
      description: >
        Запрос без тела. Сервер заново выбирает последнее задание по правилам
        GET /api/v1/admin/ai/history/latest и проверяет доступность его замены.
        У связанной публикации сохраняются время отправки и цели.
      security: [{telegramInitData: []}]
      responses:
        '202':
          description: Задание принято в очередь
          content:
            application/json:
              schema:
                type: object
                required: [accepted, id]
                properties:
                  accepted: {type: boolean, const: true}
                  id: {type: integer, format: int64, minimum: 1}
        '401': {description: Невалидный или отсутствующий initData}
        '403': {description: Не администратор}
        '409': {description: 'Нет последнего задания или его замена недоступна, код invalid_state'}
        '503': {description: 'Генератор не подключён, код ai_disabled'}
        '500': {description: Ошибка хранения}
  /api/v1/admin/ai/history/{id}:
    get:
      summary: Отдельное задание подготовки материала ИИ
      security: [{telegramInitData: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Задание, материал и статус связанной публикации
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIJob'}
        '400': {description: Некорректный ID задания}
        '401': {description: Невалидный или отсутствующий initData}
        '403': {description: Не администратор}
        '404': {description: Задание отсутствует}
        '500': {description: Ошибка хранения}
  /api/v1/admin/ai/history/{id}/versions:
    get:
      summary: Сохранённые версии материала задания ИИ
      description: Страницы включают текущую версию и отсортированы по номеру версии от новых к старым.
      security: [{telegramInitData: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Страница сохранённых версий. Для задания без версий массив items пуст.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, sort, filters]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AITopicVersion'}
                  page: {$ref: '#/components/schemas/PageMetadata'}
                  sort:
                    type: object
                    required: [field, order]
                    properties:
                      field: {type: string, const: version}
                      order: {type: string, const: desc}
                  filters:
                    type: object
                    additionalProperties: false
        '400': {description: 'Некорректный ID или параметры пагинации, код invalid_request'}
        '401': {description: Невалидный или отсутствующий initData}
        '403': {description: Не администратор}
        '404': {description: 'Задание отсутствует, код not_found'}
        '500': {description: Ошибка хранения}
  /api/v1/admin/ai/history/{id}/regenerate:
    post:
      summary: Поставить задание ИИ в очередь повторной генерации
      description: >
        Запрос без тела. Для задания с ошибкой можно повторить генерацию.
        Если с заданием связана публикация ИИ, её содержимое можно заменить
        до начала доставки с сохранением времени отправки и целей.
      security: [{telegramInitData: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '202':
          description: Задание принято в очередь
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: {type: boolean, const: true}
        '400': {description: 'Некорректный ID задания, код invalid_request'}
        '401': {description: Невалидный или отсутствующий initData}
        '403': {description: Не администратор}
        '404': {description: 'Задание отсутствует, код not_found'}
        '409': {description: 'Повторная генерация недоступна в текущем состоянии, код invalid_state'}
        '503': {description: 'Генератор не подключён, код ai_disabled'}
        '500': {description: Ошибка хранения}
  /internal/bot/v1/events:
    get:
      summary: Ближайшие мероприятия со статусом записи участника
      description: Описывает режим view=upcoming. Список включает активные будущие опубликованные встречи и собственные активные записи пользователя на будущие встречи, включая импортированные записи без опубликованного анонса. Порядок по времени начала, затем по ID публикации.
      security:
        - botServiceToken: []
      parameters:
        - name: view
          in: query
          required: true
          schema: {type: string, const: upcoming}
        - name: telegram_id
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Список без пагинации, пустой при отсутствии встреч
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotUpcomingEvent'
        '400': {description: 'Недопустимый Telegram ID, код invalid_request'}
        '401': {description: 'Требуется сервисный токен, код unauthorized'}
        '500': {description: 'Ошибка хранения, код internal_error'}
  /internal/bot/v1/events/{publication_id}/registrations/{telegram_id}/reminder:
    patch:
      summary: Изменить напоминание о мероприятии
      description: Доступно для собственной активной записи до начала встречи. Время регистрации и отметка посещения сохраняются. Повтор допустимого значения сохраняет текущее состояние напоминания.
      security:
        - botServiceToken: []
      parameters:
        - name: publication_id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: telegram_id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reminder_offset_minutes]
              properties:
                reminder_offset_minutes:
                  type: [integer, 'null']
                  format: int32
                  minimum: 1
                  description: Минуты до начала. Время напоминания должно быть в будущем. Null отключает напоминание.
      responses:
        '200':
          description: Настройка сохранена
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: {type: boolean, const: true}
        '400': {description: 'Некорректный запрос (invalid_request) или отсутствующий, недопустимый либо истёкший интервал (invalid_reminder)'}
        '401': {description: 'Требуется сервисный токен, код unauthorized'}
        '409': {description: 'Активная запись недоступна, код registration_unavailable'}
        '500': {description: 'Ошибка хранения, код internal_error'}
  /internal/bot/v1/flows/{telegram_id}/registration:
    delete:
      summary: Закрыть диалог регистрации
      description: Пара publication_id и stage удаляет только диалог на указанном шаге регистрации для этой публикации. При отсутствии обоих параметров диалог регистрации удаляется без этой проверки.
      security:
        - botServiceToken: []
      parameters:
        - name: telegram_id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: publication_id
          in: query
          description: Передаётся вместе со stage.
          schema: {type: integer, format: int64, minimum: 1}
        - name: stage
          in: query
          description: Передаётся вместе с publication_id.
          schema: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Результат удаления диалога регистрации
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    description: При проверке публикации и шага false означает, что подходящего диалога уже нет. При вызове без фильтра успешный ответ всегда содержит true.
        '400': {description: 'Некорректный запрос, код invalid_request'}
        '401': {description: 'Требуется сервисный токен, код unauthorized'}
        '500': {description: 'Ошибка хранения, код internal_error'}
  /internal/bot/v1/reminders/due:
    get:
      summary: Получить наступившие напоминания
      security:
        - botServiceToken: []
      responses:
        '200':
          description: Напоминания для отправки
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [user_id, post_id, title, text, starts_at, reminder_offset_minutes]
                  properties:
                    user_id: {type: integer, format: int64}
                    post_id: {type: integer, format: int64}
                    title: {type: string}
                    text: {type: string, description: Совместимый псевдоним названия}
                    starts_at: {type: string, format: date-time}
                    reminder_offset_minutes: {type: integer, format: int32, minimum: 1}
        '401': {description: 'Требуется сервисный токен, код unauthorized'}
        '500': {description: 'Ошибка хранения, код internal_error'}
  /internal/bot/v1/reminders/mark-sent:
    post:
      summary: Зафиксировать отправку напоминания
      security:
        - botServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [telegram_user_id, publication_id]
              properties:
                telegram_user_id: {type: integer, format: int64, minimum: 1}
                publication_id: {type: integer, format: int64, minimum: 1}
                reminder_offset_minutes:
                  type: [integer, 'null']
                  format: int32
                  description: Передайте интервал из ответа reminders/due. Если настройка изменилась, старый интервал не пометит новое напоминание отправленным.
      responses:
        '200':
          description: Признак обновления записи
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: {type: boolean}
        '400': {description: 'Некорректный запрос, код invalid_request'}
        '401': {description: 'Требуется сервисный токен, код unauthorized'}
        '500': {description: 'Ошибка хранения, код internal_error'}
components:
  securitySchemes:
    telegramInitData:
      type: http
      scheme: tma
      description: Исходная строка Telegram.WebApp.initData в заголовке Authorization.
    botServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
      description: Отдельный BOT_SERVICE_TOKEN для bot-to-backend запросов.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        enum: [10, 20, 30]
        default: 10
    EventID:
      name: event_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    MemberIdentity:
      type: object
      required: [telegram_id, first_name, last_name, username, is_admin]
      properties:
        telegram_id: {type: integer, format: int64, minimum: 1}
        first_name: {type: string}
        last_name: {type: string}
        username: {type: string}
        is_admin: {type: boolean}
    MemberProfile:
      type: object
      required: [full_name, is_russian_citizen, is_itmo_student, feedback_enabled, reminder_offset_minutes]
      properties:
        full_name: {type: [string, 'null']}
        is_russian_citizen: {type: [boolean, 'null']}
        is_itmo_student: {type: [boolean, 'null']}
        feedback_enabled: {type: boolean}
        reminder_offset_minutes:
          $ref: '#/components/schemas/MemberReminderPreference'
    MemberReminderPreference:
      type: [integer, 'null']
      minimum: 1
      description: Предпочтительный интервал из REMINDER_OPTIONS_MINUTES или null для записи без напоминания.
    MemberRegistrationProfile:
      additionalProperties: false
      type: object
      required: [full_name, is_russian_citizen, is_itmo_student]
      properties:
        full_name: {type: string, minLength: 2, maxLength: 160, description: Длина после обрезки пробельных символов}
        is_russian_citizen: {type: boolean}
        is_itmo_student: {type: boolean}
    MemberEvent:
      type: object
      required: [id, title, starts_at, ends_at, status, personal_status]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        title: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        status: {type: string, enum: [active, completed, cancelled]}
        personal_status: {type: string, enum: [not_registered, registered, unmarked, attended, missed]}
    MemberEventDetail:
      allOf:
        - $ref: '#/components/schemas/MemberEvent'
        - type: object
          required: [announcement, announcement_url, can_register, can_manage_registration, can_mark_attendance, can_leave_feedback, profile_complete, reminder_options, reminder_offset_minutes, preferred_reminder_offset_minutes]
          properties:
            announcement: {oneOf: [{ $ref: '#/components/schemas/MemberAnnouncement' }, {type: 'null'}]}
            announcement_url: {type: [string, 'null'], format: uri}
            can_register: {type: boolean}
            can_manage_registration: {type: boolean}
            can_mark_attendance: {type: boolean}
            can_leave_feedback: {type: boolean, description: Участник записан на завершившуюся встречу и встреча не отменена}
            profile_complete: {type: boolean}
            reminder_options: {type: array, items: {type: integer, minimum: 1}}
            reminder_offset_minutes: {type: [integer, 'null'], minimum: 1, description: Минуты до начала из доступных значений или null для отключения}
            preferred_reminder_offset_minutes:
              $ref: '#/components/schemas/MemberReminderPreference'
    MemberAnnouncement:
      type: object
      required: [id, text, entities, rich_message, media]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        text: {type: string}
        entities: {description: Поля форматирования текста для предпросмотра анонса}
        rich_message: {description: Блоки содержимого и оформления для предпросмотра анонса}
        media: {type: array, items: {type: object, required: [position], properties: {position: {type: integer, minimum: 0}}}}
    MemberEventsPage:
      type: object
      required: [items, page, filters, sort]
      properties:
        items: {type: array, items: { $ref: '#/components/schemas/MemberEvent' }}
        page: { $ref: '#/components/schemas/PageMetadata' }
        filters: {type: object, required: [view, search], properties: {view: {type: string, enum: [upcoming, registered, all]}, search: {type: string}}}
        sort: {type: object, required: [field, order], properties: {field: {type: string, enum: [id, title, starts_at, ends_at, status, personal_status]}, order: {type: string, enum: [asc, desc]}}}
    MemberFeedback:
      type: object
      required: [id, text, event_id, event_title, created_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        text: {type: string}
        event_id: {type: [integer, 'null'], format: int64}
        event_title: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    MemberFeedbackPage:
      type: object
      required: [items, page, sort, filters]
      properties:
        items: {type: array, items: { $ref: '#/components/schemas/MemberFeedback' }}
        page: { $ref: '#/components/schemas/PageMetadata' }
        sort: {type: object, required: [field, order], properties: {field: {type: string, const: created_at}, order: {type: string, enum: [asc, desc]}}}
        filters: {type: object, maxProperties: 0}
    BotUpcomingEvent:
      type: object
      required: [post_id, title, text, starts_at, ends_at, registered, reminders_enabled, reminder_offset_minutes, announcement_url]
      properties:
        post_id: {type: integer, format: int64, description: ID публикации для Bot API}
        title: {type: string}
        text: {type: string, description: Совместимый псевдоним названия}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        registered: {type: boolean}
        announcement_url: {type: [string, 'null'], format: uri, description: Ссылка на доставленный анонс в Telegram. При отсутствии подходящей доставки возвращается null.}
        reminders_enabled: {type: boolean}
        reminder_offset_minutes: {type: [integer, 'null'], format: int32}
    AISettingsInput:
      type: object
      additionalProperties: false
      required: [jlpt_level]
      properties:
        jlpt_level: {type: string, enum: [N5, N4, N3, N2, N1]}
        admin_comment: {type: [string, 'null'], maxLength: 500}
    AISettings:
      type: object
      required: [jlpt_level, admin_comment, enabled]
      properties:
        jlpt_level: {type: string, enum: [N5, N4, N3, N2, N1]}
        admin_comment: {type: [string, 'null'], maxLength: 500}
        enabled: {type: boolean, description: Ключ и конфигурация генератора заданы при запуске backend}
    AIAutomation:
      type: object
      required: [enabled, configured, can_cancel_today, can_cancel_queued, queued_publication_id]
      properties:
        enabled: {type: boolean, description: Ежедневная генерация настроена и включена сохранённой настройкой}
        configured: {type: boolean, description: Генератор настроен и задано AI_TOPIC_AUTO_PUBLISH_TIME}
        can_cancel_today: {type: boolean, description: Сегодняшний автоматический пост можно отменить. День определяется TIMEZONE.}
        can_cancel_queued: {type: boolean, description: Последний поставленный в очередь ИИ-пост можно отменить.}
        queued_publication_id:
          type: [integer, 'null']
          format: int64
          description: ID последнего поставленного в очередь ИИ-поста или null при недоступной отмене.
    AIJob:
      type: object
      required: [id, scheduled_for, status, attempts, topic, publication_id, publication_status, last_error, version_count, can_regenerate]
      properties:
        id: {type: integer, format: int64}
        scheduled_for: {type: string, format: date-time}
        status: {type: string, enum: [pending, retry, generating, scheduled, failed, cancelled]}
        attempts: {type: integer, minimum: 0}
        topic:
          type: [object, 'null']
          description: Материал в формате Topic модуля learningcontent, включая импортированную историю
          additionalProperties: true
        publication_id: {type: [integer, 'null'], format: int64}
        publication_status:
          type: [string, 'null']
          enum: [draft, scheduled, sent, failed, cancelled, null]
          description: Текущий статус связанной публикации или null при её отсутствии.
        last_error: {type: [string, 'null']}
        version_count:
          type: integer
          format: int64
          minimum: 0
          description: Число сохранённых версий материала, включая текущую.
        can_regenerate:
          type: boolean
          description: Доступна ли повторная генерация с учётом состояния задания, доставки и подключения генератора.
    AITopicVersion:
      type: object
      required: [version, topic]
      properties:
        version: {type: integer, minimum: 1}
        topic:
          type: object
          description: Сохранённый материал в формате Topic модуля learningcontent, включая импортированную историю.
          additionalProperties: true
