openapi: 3.1.0
info:
  title: Hikari Secretary Backend API
  version: 0.3.0-dev
  description: |
    Внутренний API платформы Hikari Secretary. Административные предметные
    endpoints требуют проверенные Telegram Mini App credentials и роль
    администратора. Внутренние Bot API endpoints требуют отдельный service token.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Проверка работоспособности процесса
      responses:
        '200':
          description: Процесс запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      summary: Проверка готовности сервиса и PostgreSQL
      responses:
        '200':
          description: PostgreSQL доступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: PostgreSQL временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/admin/me:
    get:
      summary: Текущий аутентифицированный администратор
      security:
        - telegramInitData: []
      responses:
        '200':
          description: Подписанный пользователь Telegram присутствует в списке администраторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Administrator'
        '401':
          description: Telegram initData отсутствует, изменён или устарел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь Telegram не является администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/people:
    get:
      summary: Постраничный список людей для администрации
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Поиск по ФИО, Telegram username или отображаемому имени.
          schema:
            type: string
            maxLength: 100
        - name: is_russian_citizen
          in: query
          schema:
            type: boolean
        - name: is_itmo_student
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, visits, last_visit]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Список людей и применённые параметры таблицы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeoplePage'
        '400':
          description: Один из query-параметров не соответствует контракту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Telegram initData отсутствует, изменён или устарел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь Telegram не является администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/bot/v1/people/identity:
    post:
      summary: Синхронизировать Telegram-идентичность человека из бота
      description: Этот маршрут не публикуется наружу reverse proxy.
      security:
        - botServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncTelegramIdentityRequest'
      responses:
        '200':
          description: Идентичность создана или обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramIdentity'
        '400':
          description: Неподходящее тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверный service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/events:
    post:
      "summary": "Create/update event linked to a draft; starts_at must be in the future"
      "security":
        -
          "telegramInitData":
            []
      "parameters":
        []
      "responses":
        "201":
          "description": "Create/update event linked to a draft; starts_at must be in the future"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Event"
        "400":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "publication_id":
                  "type": "integer"
                  "format": "int64"
                "title":
                  "type": "string"
                  "maxLength": 160
                  "minLength": 1
                "starts_at":
                  "type": "string"
                  "format": "date-time"
                "ends_at":
                  "type": "string"
                  "format": "date-time"
              "required":
                - "publication_id"
                - "title"
                - "starts_at"
                - "ends_at"
              "additionalProperties": false
    get:
      summary: Постраничный список мероприятий
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, cancelled, completed]
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: starts_from
          in: query
          schema:
            type: string
            format: date-time
        - name: starts_to
          in: query
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          schema:
            type: string
            enum: [starts_at, title, created_at]
            default: starts_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Список мероприятий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '400':
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Невалидный Telegram initData
        '403':
          description: Нет роли администратора
  /api/v1/admin/events/{event_id}:
    get:
      summary: Карточка мероприятия
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Мероприятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Мероприятие не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/events/{event_id}/participants:
    get:
      summary: Участники мероприятия
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/EventID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [registered, cancelled]
        - name: is_russian_citizen
          in: query
          schema:
            type: boolean
        - name: is_itmo_student
          in: query
          schema:
            type: boolean
        - name: needs_pass
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, registered_at, needs_pass]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Список участников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsPage'
        '400':
          description: Некорректные параметры
        '404':
          description: Мероприятие не найдено
  /api/v1/admin/events/{event_id}/cancel:
    post:
      summary: Отменить активное мероприятие
      description: Уведомления зарегистрированным участникам атомарно ставятся в outbox.
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Мероприятие отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEventResult'
        '404':
          description: Мероприятие не найдено
        '409':
          description: Мероприятие уже отменено или завершено
  /api/v1/admin/publications:
    "get":
      "summary": "Publications; from inclusive/to exclusive filter scheduled_at"
      "security":
        -
          "telegramInitData":
            []
      "parameters":
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/PageSize"
        -
          "name": "order"
          "in": "query"
          "schema":
            "type": "string"
            "enum":
              - "asc"
              - "desc"
            "default": "desc"
        -
          "name": "from"
          "in": "query"
          "schema":
            "type": "string"
            "format": "date-time"
        -
          "name": "to"
          "in": "query"
          "schema":
            "type": "string"
            "format": "date-time"
        -
          "name": "sort"
          "in": "query"
          "schema":
            "type": "string"
            "enum":
              - "created_at"
              - "scheduled_at"
        -
          "name": "status"
          "in": "query"
          "schema":
            "type": "string"
            "enum":
              - "draft"
              - "scheduled"
              - "sent"
              - "failed"
              - "cancelled"
        -
          "name": "source"
          "in": "query"
          "schema":
            "type": "string"
        -
          "name": "target"
          "in": "query"
          "schema":
            "type": "string"
      "responses":
        "200":
          "description": "Publications; from inclusive/to exclusive filter scheduled_at"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "items":
                    "type": "array"
                    "items":
                      "type": "object"
                      "properties":
                        "id":
                          "type": "integer"
                          "format": "int64"
                        "creator_telegram_id":
                          "type": "integer"
                          "format": "int64"
                        "text":
                          "type": "string"
                        "status":
                          "type": "string"
                        "source":
                          "type": "string"
                        "scheduled_at":
                          "type":
                            - "string"
                            - "null"
                        "created_at":
                          "type": "string"
                          "format": "date-time"
                  "page":
                    "$ref": "#/components/schemas/PageMetadata"
                  "sort":
                    "type": "object"
                    "properties":
                      "field":
                        "type": "string"
                      "order":
                        "type": "string"
                  "filters":
                    "type": "object"
                    "properties":
                      {}
        "400":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
    "post":
      "summary": "Create draft; text limit is 1024 with images, 4096 without"
      "security":
        -
          "telegramInitData":
            []
      "parameters":
        -
          "name": "Idempotency-Key"
          "in": "header"
          "schema":
            "type": "string"
            "maxLength": 128
          "description": "Retry returns the first publication without modifying it; scoped to administrator."
      "responses":
        "201":
          "description": "Create draft; text limit is 1024 with images, 4096 without"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "id":
                    "type": "integer"
                    "format": "int64"
        "400":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "text":
                  "type": "string"
                  "maxLength": 4096
                "media_ids":
                  "type": "array"
                  "maxItems": 10
                  "items":
                    "type": "string"
                "target_keys":
                  "type": "array"
                  "uniqueItems": true
                  "items":
                    "type": "string"
              "additionalProperties": false
  /api/v1/admin/publications/{id}:
    "get":
      "summary": "Publication detail"
      "security":
        -
          "telegramInitData":
            []
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
      "responses":
        "200":
          "description": "Publication detail"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "id":
                    "type": "integer"
                    "format": "int64"
                  "creator_id":
                    "type": "integer"
                    "format": "int64"
                  "text":
                    "type": "string"
                  "status":
                    "type": "string"
                  "source":
                    "type": "string"
                  "scheduled_at":
                    "type":
                      - "string"
                      - "null"
                    "format": "date-time"
                  "entities":
                    "type":
                      - "array"
                      - "null"
                    "items":
                      "type": "object"
                      "properties":
                        {}
                  "rich_message":
                    "type":
                      - "object"
                      - "null"
                  "media_ids":
                    "type": "array"
                    "items":
                      "type": "string"
                  "deliveries":
                    "type": "array"
                    "items":
                      "type": "object"
                      "properties":
                        {}
                  "event":
                    "type":
                      - "object"
                      - "null"
        "400":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
    "put":
      "summary": "Replace draft contents and targets"
      "security":
        -
          "telegramInitData":
            []
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
      "responses":
        "200":
          "description": "Replace draft contents and targets"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "id":
                    "type": "integer"
                    "format": "int64"
        "400":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Error: invalid_request, unauthorized, forbidden, not_found, invalid_state, capacity_limit, media_too_large or internal_error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "text":
                  "type": "string"
                  "maxLength": 4096
                "media_ids":
                  "type": "array"
                  "maxItems": 10
                  "items":
                    "type": "string"
                "target_keys":
                  "type": "array"
                  "uniqueItems": true
                  "items":
                    "type": "string"
              "additionalProperties": false
  /api/v1/admin/publications/{id}/schedule:
    "post":
      "summary": "Schedule; empty object means publish immediately"
      "security":
        -
          "telegramInitData":
            []
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
