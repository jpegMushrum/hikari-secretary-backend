  /api/v1/admin/publications/{id}/settings:
    put:
      summary: Настроить цели и мероприятие черновика без изменения сообщения
      description: Одна транзакция. Telegram entities, rich_message, медиа и source сохраняются. Отсутствующий/null event сохраняет существующую связь, не отключает регистрацию.
      security: [{telegramInitData: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_keys]
              properties:
                target_keys:
                  type: array
                  uniqueItems: true
                  items: {type: string}
                  description: Только ключи из GET /targets. Пустой массив разрешён для черновика.
                event:
                  type: [object, 'null']
                  additionalProperties: false
                  required: [title, starts_at, ends_at]
                  properties:
                    title: {type: string, minLength: 1, maxLength: 160}
                    starts_at: {type: string, format: date-time}
                    ends_at: {type: string, format: date-time}
      responses:
        '200':
          description: Обновлённая публикация в формате GET /publications/{id}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '400': {description: invalid_request или invalid_target}
        '401': {description: Не авторизован}
        '403': {description: Не администратор}
        '404': {description: Черновик не найден}
        '409': {description: invalid_state, capacity_limit или event_not_active}
        '500': {description: Ошибка хранения; транзакция откатывается}
  /api/v1/admin/publications/{id}/media/{position}:
    get:
      summary: Прочитать фотографию публикации для предпросмотра
      description: Позиция с нуля; только файлы внутри ADMIN_MEDIA_DIR или BOT_MEDIA_DIR. Файловые пути клиент не задаёт. Ответ private, no-store.
      security: [{telegramInitData: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: position
          in: path
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Фото из общего media volume
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '400': {description: Некорректный ID или позиция}
        '401': {description: Не авторизован}
        '403': {description: Не администратор}
        '404': {description: Файл отсутствует или находится вне разрешённых каталогов}
