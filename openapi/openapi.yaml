    put:
      summary: Включить или выключить ежедневную генерацию ИИ
      description: Настройка сохраняется в PostgreSQL. Выключение сохраняет сегодняшний пост.
      security: [{telegramInitData: []}]
      requestBody:
        required: true
        content:
