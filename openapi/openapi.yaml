openapi: 3.1.0
info:
  title: Hikari Secretary Backend API
  version: 0.4.0
  description: |
    Внутренний API платформы Hikari Secretary. Административные предметные
    endpoints требуют проверенные Telegram Mini App credentials и роль
    администратора. Member API использует те же Telegram credentials и
    определяет участника по подписанной личности Telegram. Внутренние Bot API
    endpoints требуют отдельный service token.
servers:
  - url: /
paths:
  /api/v1/member/me:
    get:
      summary: Текущий участник Telegram и признак роли администратора
      security:
        - telegramInitData: []
      responses:
        '200':
          description: Запрос выполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberIdentity' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/member/profile:
    get:
      summary: Собственный профиль и настройка предложений об отзыве
      security:
        - telegramInitData: []
      responses:
        '200':
          description: Запрос выполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberProfile' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      summary: Обновить обязательные поля своего профиля
      security:
        - telegramInitData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [full_name, is_russian_citizen, is_itmo_student]
              properties:
                full_name: {type: string, minLength: 2, maxLength: 160, description: Длина после обрезки пробельных символов}
                is_russian_citizen: {type: boolean}
                is_itmo_student: {type: boolean}
                feedback_enabled: {type: [boolean, 'null'], description: При пропуске или null сохраняется текущее значение}
      responses:
        '204':
          description: Изменение сохранено
        '400':
          description: Некорректные параметры или тело запроса (`invalid_request`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      summary: Изменить личные настройки отзывов или напоминаний
      security:
        - telegramInitData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                feedback_enabled: {type: boolean}
                reminder_offset_minutes:
                  $ref: '#/components/schemas/MemberReminderPreference'
      responses:
        '204':
          description: Изменение сохранено
        '400':
          description: Некорректное тело или интервал напоминания (`invalid_request`, `invalid_reminder`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/member/events:
    get:
      summary: Мероприятия с личным статусом записи и посещения
      security:
        - telegramInitData: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: view, in: query, schema: {type: string, enum: [upcoming, registered, all], default: upcoming}}
        - {name: search, in: query, schema: {type: string, maxLength: 100, description: Подстрока названия или ID}}
        - {name: sort, in: query, schema: {type: string, enum: [id, title, starts_at, ends_at, status, personal_status], default: starts_at}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], description: По умолчанию desc для all и asc для остальных представлений}}
      responses:
        '200':
          description: Запрос выполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberEventsPage' }
        '400':
          description: Некорректные параметры или тело запроса (`invalid_request`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/member/events/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      summary: Карточка мероприятия с анонсом и доступными действиями
      security:
        - telegramInitData: []
      responses:
        '200':
          description: Запрос выполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberEventDetail' }
        '400':
          description: Некорректные параметры или тело запроса (`invalid_request`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Объект отсутствует или недоступен (`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/member/events/{id}/media/{position}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      summary: Изображение опубликованного анонса по индексу с нуля
      security:
        - telegramInitData: []
      parameters:
        - {name: position, in: path, required: true, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Файл изображения
          content:
            'image/*':
              schema: {type: string, format: binary}
        '400':
          description: Некорректные параметры или тело запроса (`invalid_request`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Объект отсутствует или недоступен (`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/member/events/{id}/registration:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      summary: Записаться на встречу, при необходимости одновременно заполнив профиль
      description: Выбранное напоминание применяется к этой записи. Сохранённая настройка будущих встреч сохраняет своё значение.
      security:
        - telegramInitData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reminder_offset_minutes]
              properties:
                reminder_offset_minutes: {type: [integer, 'null'], minimum: 1, description: Минуты до начала из доступных значений или null для отключения}
                profile: {oneOf: [{ $ref: '#/components/schemas/MemberRegistrationProfile' }, {type: 'null'}]}
      responses:
        '204':
          description: Изменение сохранено
        '400':
          description: Некорректное тело, время напоминания или профиль (`invalid_request`, `invalid_reminder`, `invalid_profile`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Объект отсутствует или недоступен (`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Запись недоступна или нужен профиль (`registration_unavailable`, `profile_incomplete`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      summary: Изменить или отключить напоминание до начала встречи
      description: Напоминание текущей записи и настройка для будущих встреч обновляются атомарно.
      security:
        - telegramInitData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reminder_offset_minutes]
              properties:
                reminder_offset_minutes: {type: [integer, 'null'], minimum: 1, description: Минуты до начала из доступных значений или null для отключения}
      responses:
        '204':
          description: Изменение сохранено
        '400':
          description: Некорректное тело или время напоминания (`invalid_request`, `invalid_reminder`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Объект отсутствует или недоступен (`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Управление записью недоступно (`registration_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Отменить свою запись до начала встречи
      security:
        - telegramInitData: []
      responses:
        '204':
          description: Изменение сохранено
        '400':
          description: Некорректные параметры или тело запроса (`invalid_request`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Объект отсутствует или недоступен (`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Управление записью недоступно (`registration_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/member/events/{id}/attendance:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    put:
      summary: Однократно отметить посещение завершившейся встречи по своей записи
      security:
        - telegramInitData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attended]
              properties:
                attended: {type: boolean}
      responses:
        '204':
          description: Изменение сохранено
        '400':
          description: Некорректные параметры или тело запроса (`invalid_request`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Отметка недоступна или уже сохранена (`attendance_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/member/feedback:
    get:
      summary: Постраничная история собственных отзывов
      security:
        - telegramInitData: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: sort, in: query, schema: {type: string, enum: [created_at], default: created_at}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
      responses:
        '200':
          description: Запрос выполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberFeedbackPage' }
        '400':
          description: Некорректные параметры или тело запроса (`invalid_request`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Оставить общий отзыв или отзыв о встрече
      description: Для отзыва о встрече нужна действующая запись участника на завершившуюся встречу. Отмена встречи исключает возможность отзыва о ней.
      security:
        - telegramInitData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 3000, description: Длина после обрезки пробельных символов}
                event_id: {type: [integer, 'null'], format: int64, minimum: 1, description: ID встречи или null для общего отзыва}
      responses:
        '204':
          description: Изменение сохранено
        '400':
          description: Некорректные параметры или тело запроса (`invalid_request`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Объект отсутствует или недоступен (`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/member/feedback/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    delete:
      summary: Удалить собственный отзыв
      security:
        - telegramInitData: []
      responses:
        '204':
          description: Изменение сохранено
        '400':
          description: Некорректные параметры или тело запроса (`invalid_request`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Нужна действительная Telegram initData (`unauthorized`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Объект отсутствует или недоступен (`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Внутренняя ошибка (`internal_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /healthz:
    get:
      summary: Проверка работоспособности процесса
      responses:
        '200':
          description: Процесс запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      summary: Проверка готовности сервиса и PostgreSQL
      responses:
        '200':
          description: PostgreSQL доступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: PostgreSQL временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/admin/me:
    get:
      summary: Текущий аутентифицированный администратор
      security:
        - telegramInitData: []
      responses:
        '200':
          description: Подписанный пользователь Telegram присутствует в списке администраторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Administrator'
        '401':
          description: Telegram initData отсутствует, изменён или устарел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь Telegram не является администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/people:
    get:
      summary: Постраничный список людей для администрации
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: >-
            Поиск буквальной подстроки без учёта регистра в ФИО, отображаемом
            имени, Telegram username (с @ или без), внутреннем ID или Telegram ID.
          schema:
            type: string
            maxLength: 100
        - name: is_russian_citizen
          in: query
          schema:
            type: boolean
        - name: is_itmo_student
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, name, visits, last_visit, feedback_count, is_russian_citizen, is_itmo_student]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Список людей и применённые параметры таблицы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeoplePage'
        '400':
          description: Один из query-параметров не соответствует контракту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Telegram initData отсутствует, изменён или устарел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь Telegram не является администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/bot/v1/people/identity:
    post:
      summary: Синхронизировать Telegram-идентичность человека из бота
      description: Этот маршрут не публикуется наружу reverse proxy.
      security:
        - botServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncTelegramIdentityRequest'
      responses:
        '200':
          description: Идентичность создана или обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramIdentity'
        '400':
          description: Неподходящее тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверный service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/event-workspace:
    get:
      summary: Единый список мероприятий и черновиков публикаций
      description: |
        Черновик имеет kind=draft и id публикации; переход выполняется по publication_id.
        После постановки в очередь связанное мероприятие имеет kind=event и id мероприятия.
        Связанное с черновиком мероприятие не дублируется. Черновики без даты
        исключаются фильтром периода. Сортировка, подсчёт и пагинация применяются ко всему списку.
      security:
        - telegramInitData: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: {type: string, enum: [draft, active, completed, cancelled]}
        - name: search
          in: query
          description: >-
            Поиск буквальной подстроки без учёта регистра в названии или ID записи.
            Черновик можно найти по ID публикации или ID связанного мероприятия.
          schema: {type: string, maxLength: 100}
        - name: starts_from
          in: query
          schema: {type: string, format: date-time}
        - name: starts_to
          in: query
          schema: {type: string, format: date-time}
        - name: sort
          in: query
          schema: {type: string, enum: [id, title, starts_at, created_at, status, registrations, attended], default: starts_at}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc], default: asc}
      responses:
        '200':
          description: Страница единого списка; даты без значения равны null
          content:
            application/json:
              schema:
