components:
  securitySchemes:
    telegramInitData:
      type: http
      scheme: tma
      description: Исходная строка Telegram.WebApp.initData в заголовке Authorization.
    botServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
      description: Отдельный BOT_SERVICE_TOKEN для bot-to-backend запросов.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        enum: [10, 20, 30]
        default: 10
    EventID:
      name: event_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    Administrator:
      type: object
      required: [telegram_id, first_name, last_name, username]
      properties:
        telegram_id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          examples: [unauthorized]
    PersonListItem:
      type: object
      required: [id, telegram_user_id, display_name, visits, feedback_count]
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: [string, 'null']
        telegram_user_id:
          type: integer
          format: int64
        username:
          type: [string, 'null']
        display_name:
          type: string
        is_russian_citizen:
          type: [boolean, 'null']
        is_itmo_student:
          type: [boolean, 'null']
        visits:
          type: integer
          format: int64
        feedback_count:
          type: integer
          format: int64
        last_visit_at:
          type: [string, 'null']
          format: date-time
    PeoplePage:
      type: object
      required: [items, page, sort, filters]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonListItem'
        page:
          $ref: '#/components/schemas/PageMetadata'
        sort:
          type: object
          required: [field, order]
          properties:
            field:
              type: string
              enum: [name, visits, last_visit]
            order:
              type: string
              enum: [asc, desc]
        filters:
          type: object
    PageMetadata:
      type: object
      required: [number, size, total_items, total_pages]
      properties:
        number:
          type: integer
        size:
          type: integer
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    SyncTelegramIdentityRequest:
      type: object
      required: [telegram_user_id, display_name]
      properties:
        telegram_user_id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
          maxLength: 33
        display_name:
          type: string
          minLength: 1
          maxLength: 256
    TelegramIdentity:
      type: object
      required: [person_id, telegram_user_id, username, display_name]
      properties:
        person_id:
          type: integer
          format: int64
        telegram_user_id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type: string
    Event:
      type: object
      required: [id, title, starts_at, ends_at, status, published, registrations, cancelled_registrations, attended, created_at]
      properties:
        id:
          type: integer
          format: int64
        publication_id:
          type: [integer, 'null']
          format: int64
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, cancelled, completed]
        published:
          type: boolean
        registrations:
          type: integer
          format: int64
        cancelled_registrations:
          type: integer
          format: int64
        attended:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    Participant:
      type: object
      required: [person_id, telegram_user_id, full_name, registered_at, status, needs_pass]
      properties:
        person_id:
          type: integer
          format: int64
        telegram_user_id:
          type: integer
          format: int64
        full_name:
          type: string
        username:
          type: [string, 'null']
        registered_at:
          type: string
          format: date-time
        cancelled_at:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [registered, cancelled]
        attended:
          type: [boolean, 'null']
        is_russian_citizen:
          type: [boolean, 'null']
        is_itmo_student:
          type: [boolean, 'null']
        needs_pass:
          type: boolean
    EventsPage:
      type: object
      required: [items, page, sort, filters]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          $ref: '#/components/schemas/PageMetadata'
        sort:
          type: object
        filters:
          type: object
    ParticipantsPage:
      type: object
      required: [items, page, sort, filters]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        page:
          $ref: '#/components/schemas/PageMetadata'
        sort:
          type: object
        filters:
          type: object
    CancelEventResult:
